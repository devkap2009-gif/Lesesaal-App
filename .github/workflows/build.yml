name: APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK bauen
        run: gradle :app:assembleDebug --no-daemon
      - name: APK signieren (eigener Schlüssel, falls hinterlegt)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ks.jks
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            $BT/apksigner sign --ks ks.jks --ks-pass env:KEYSTORE_PASSWORD --out Lesesaal.apk app/build/outputs/apk/debug/app-debug.apk
            rm ks.jks
          else
            cp app/build/outputs/apk/debug/app-debug.apk Lesesaal.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Lesesaal-APK
          path: Lesesaal.apk
      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Lesesaal.apk --title "Lesesaal – neueste Version" --notes "Lade Lesesaal.apk auf deinem Android-Handy herunter und installiere sie."
